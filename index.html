<script>(function(){
    window._loadedBytes = 0;

    window._updateLoadingUI = function() {
        var el = document.getElementById("loading-overlay");
        if (!el) return;
        var loadedMb = (window._loadedBytes / 1048576).toFixed(1);
        if (window._totalBytes > 0) {
            var totalMb = (window._totalBytes / 1048576).toFixed(1);
            el.textContent = "Loading... " + loadedMb + " / " + totalMb + " MB";
        } else {
            el.textContent = "Loading... " + loadedMb + " MB";
        }
    };
    var _trackedFetch = window.fetch.bind(window);
    window.fetch = async function(...args) {
        var res = await _trackedFetch(...args);
        if (!res.body) return res;
        var reader = res.body.getReader();
        var chunks = [];
        while (true) {
            var r = await reader.read();
            if (r.done) break;
            chunks.push(r.value);
            window._loadedBytes += r.value.length;
            window._updateLoadingUI();
        }
        return new Response(new Blob(chunks), { status: res.status, statusText: res.statusText, headers: res.headers });
    };
})();</script>
<script>(function(){
    var OLD_APPID = "14527028-e469-4b6a-bf21-2ba4f5ed0d9b";
    var NEW_APPID = "ddc2c875-d8bd-4399-895a-459e22383f0a";
    var encoder = new TextEncoder();
    var oldBytes = encoder.encode(OLD_APPID);
    var newBytes = encoder.encode(NEW_APPID);

    function patchView(view) {
        for (var i = 0; i <= view.length - oldBytes.length; i++) {
            var match = true;
            for (var j = 0; j < oldBytes.length; j++) {
                if (view[i + j] !== oldBytes[j]) { match = false; break; }
            }
            if (match) {
                for (var j = 0; j < newBytes.length; j++) view[i + j] = newBytes[j];
                i += oldBytes.length - 1;
            }
        }
    }

    var _cfgOverrides = { "AppVersion": "0.5.0.1" };
    var _botBaseUrl = "https://cdn.jsdelivr.net/gh/CatHead132/CatHead132.github.io@main/hype/";
    var _botListApiUrl = "https://api.github.com/repos/CatHead132/CatHead132.github.io/contents/hype";
    var _botListTimeout = new Promise(function(resolve) { setTimeout(function() { resolve(null); }, 3000); });
    var _botListPromise = Promise.race([
        fetch(_botListApiUrl).then(function(r) { return r.json(); }).then(function(files) {
            var list = files.filter(function(f) {
                return f.type === "file" && /\.(png|jpg|jpeg|gif|webp)$/i.test(f.name);
            }).map(function(f) {
                var name = f.name.replace(/\.[^.]+$/, "");
                return "#" + name + "|" + _botBaseUrl + f.name;
            }).join(";");
            _cfgOverrides["NextbotList"] = list;
            return list;
        }).catch(function() { return null; }),
        _botListTimeout
    ]);

    function _applyCfgOverrides(text) {
        var data = JSON.parse(text);
        if (data && data.configs && data.configs.settings) {
            for (var k in _cfgOverrides) data.configs.settings[k] = _cfgOverrides[k];
        }
        return JSON.stringify(data);
    }
    var _origFetch = window.fetch ? window.fetch.bind(window) : null;
    if (_origFetch) {
        window.fetch = function(resource, init) {
            var url = typeof resource === "string" ? resource : (resource && resource.url) || "";
            if (url.indexOf("config.services.api.unity.com/settings") === -1) {
                return _origFetch(resource, init);
            }
            var _fallbackTimeout = new Promise(function(resolve) {
                setTimeout(function() {
                    var fallbackBody = JSON.stringify({ configs: { settings: Object.assign({}, _cfgOverrides) } });
                    resolve(new Response(fallbackBody, { status: 200, statusText: "OK (local fallback, real config unreachable)" }));
                }, 6000);
            });
            return Promise.race([_origFetch(resource, init), _fallbackTimeout]).then(function(resp) {
                return resp.clone().text().then(function(text) {
                    return _botListPromise.then(function() {
                        try {
                            var newText = _applyCfgOverrides(text);
                            return new Response(newText, { status: resp.status, statusText: resp.statusText, headers: resp.headers });
                        } catch (e) {
                            return resp;
                        }
                    });
                });
            });
        };
    }

    var _origXHROpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url) {
        this.__cfgIntercept = typeof url === "string" && url.indexOf("config.services.api.unity.com/settings") !== -1;
        return _origXHROpen.apply(this, arguments);
    };
    var _origXHRSend = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.send = function(body) {
        if (this.__cfgIntercept) {
            var self = this;
            var _settled = false;
            this.addEventListener("readystatechange", function() {
                if (self.readyState !== 4 || self.status !== 200) return;
                _settled = true;
                _botListPromise.then(function() {
                    try {
                        var newText = _applyCfgOverrides(self.responseText);
                        Object.defineProperty(self, "responseText", { get: function() { return newText; }, configurable: true });
                        Object.defineProperty(self, "response", { get: function() { return newText; }, configurable: true });
                    } catch (e) {}
                });
            });
            setTimeout(function() {
                if (_settled) return;
                try { self.abort(); } catch (e) {}
                var fallbackBody = JSON.stringify({ configs: { settings: Object.assign({}, _cfgOverrides) } });
                Object.defineProperty(self, "readyState", { get: function() { return 4; }, configurable: true });
                Object.defineProperty(self, "status", { get: function() { return 200; }, configurable: true });
                Object.defineProperty(self, "responseText", { get: function() { return fallbackBody; }, configurable: true });
                Object.defineProperty(self, "response", { get: function() { return fallbackBody; }, configurable: true });
                self.dispatchEvent(new Event("readystatechange"));
                self.dispatchEvent(new Event("load"));
                self.dispatchEvent(new Event("loadend"));
            }, 6000);
        }
        return _origXHRSend.apply(this, arguments);
    };

    var origSend = WebSocket.prototype.send;
    WebSocket.prototype.send = function(data) {
        try {
            var view = null;
            if (data instanceof ArrayBuffer) {
                view = new Uint8Array(data);
            } else if (ArrayBuffer.isView(data)) {
                view = new Uint8Array(data.buffer, data.byteOffset, data.byteLength);

            }

                patchView(view);
            }
        } catch (e) {}
        return origSend.call(this, data);
    };
}());</script><script>(function(){
    var PANEL_ID = "__ls_editor_panel";
    function buildPanel() {
        var style = document.createElement("style");
        style.textContent =
            "#" + PANEL_ID + " { position:fixed;top:20px;right:20px;width:420px;max-height:80vh;overflow:auto;" +
            "background:#000;color:#ccc;font:12px Consolas,'Courier New',monospace;border:1px solid #333;" +
            "z-index:2147483647;padding:10px;display:none; }" +
            "#" + PANEL_ID + " button { background:#000;color:#ccc;border:1px solid #444;padding:3px 9px;font:inherit;cursor:pointer; }" +
            "#" + PANEL_ID + " button:hover { border-color:#888;color:#fff; }" +
            "#" + PANEL_ID + " input, #" + PANEL_ID + " textarea { background:#000;color:#ddd;border:1px solid #333;font:inherit;padding:3px 5px; }" +
            "#" + PANEL_ID + " input:focus, #" + PANEL_ID + " textarea:focus { outline:none;border-color:#777; }" +
            "#" + PANEL_ID + " .ls-title { font-weight:bold;letter-spacing:.04em;color:#eee; }" +
            "#" + PANEL_ID + " .ls-key { color:#fff;font-weight:bold;margin-bottom:2px;word-break:break-all; }" +
            "#" + PANEL_ID + " .ls-row { margin-bottom:6px;border-bottom:1px solid #222;padding-bottom:6px; }" +
            "#" + PANEL_ID + " .ls-empty { color:#666; }";
        document.head.appendChild(style);

        var panel = document.createElement("div");
        panel.id = PANEL_ID;
        panel.innerHTML =
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
              '<span class="ls-title">localStorage Editor (Ctrl+Alt+L)</span>' +
              '<div>' +
                '<button id="__ls_export" style="margin-right:4px;">Export</button>' +
                '<button id="__ls_import" style="margin-right:4px;">Import</button>' +
                '<button id="__ls_refresh" style="margin-right:4px;">Refresh</button>' +
                '<button id="__ls_close">X</button>' +
              '</div>' +
            '</div>' +
            '<div id="__ls_rows"></div>' +
            '<div style="margin-top:8px;"><input id="__ls_newkey" placeholder="new key" style="width:60%;"> <button id="__ls_add">Add</button></div>' +
            '<input type="file" id="__ls_importfile" style="display:none" accept="application/json">';
        document.body.appendChild(panel);

        panel.querySelector("#__ls_close").onclick = function(){ panel.style.display = "none"; };
        panel.querySelector("#__ls_refresh").onclick = renderRows;
        panel.querySelector("#__ls_export").onclick = exportAll;
        panel.querySelector("#__ls_import").onclick = function(){ panel.querySelector("#__ls_importfile").click(); };
        panel.querySelector("#__ls_importfile").onchange = importFile;
        panel.querySelector("#__ls_add").onclick = function(){
            var k = panel.querySelector("#__ls_newkey").value;
            if (!k) return;
            localStorage.setItem(k, "");
            panel.querySelector("#__ls_newkey").value = "";
            renderRows();
        };
        return panel;
    }

    function renderRows() {
        var panel = document.getElementById(PANEL_ID);
        var rowsEl = panel.querySelector("#__ls_rows");
        rowsEl.innerHTML = "";
        var keys = Object.keys(localStorage).sort();
        keys.forEach(function(key) {
            var row = document.createElement("div");
            row.className = "ls-row";
            var label = document.createElement("div");
            label.textContent = key;
            label.className = "ls-key";
            var ta = document.createElement("textarea");
            ta.value = localStorage.getItem(key);
            ta.style.cssText = "width:100%;height:50px;font-size:11px;box-sizing:border-box;";
            var btnRow = document.createElement("div");
            btnRow.style.cssText = "margin-top:2px;text-align:right;";
            var saveBtn = document.createElement("button");
            saveBtn.textContent = "Save";
            saveBtn.onclick = function(){ localStorage.setItem(key, ta.value); saveBtn.textContent = "Saved!"; setTimeout(function(){ saveBtn.textContent = "Save"; }, 800); };
            var delBtn = document.createElement("button");
            delBtn.textContent = "Delete";
            delBtn.style.marginLeft = "4px";
            delBtn.onclick = function(){ localStorage.removeItem(key); renderRows(); };
            btnRow.appendChild(saveBtn);
            btnRow.appendChild(delBtn);
            row.appendChild(label);
            row.appendChild(ta);
            row.appendChild(btnRow);
            rowsEl.appendChild(row);
        });
        if (keys.length === 0) {
            rowsEl.innerHTML = '<div class="ls-empty">(empty)</div>';
        }
    }

    function exportAll() {
        var out = {};
        Object.keys(localStorage).forEach(function(k){ out[k] = localStorage.getItem(k); });
        var blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "hype_localstorage_" + Date.now() + ".json";
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    function importFile(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function() {
            try {
                var data = JSON.parse(reader.result);
                Object.keys(data).forEach(function(k){ localStorage.setItem(k, data[k]); });
                renderRows();
                alert("Imported " + Object.keys(data).length + " keys.");
            } catch (err) {
                alert("Invalid JSON file: " + err.message);
            }
        };
        reader.readAsText(file);
        e.target.value = "";
    }

    function togglePanel() {
        var panel = document.getElementById(PANEL_ID) || buildPanel();
        if (panel.style.display === "none") {
            renderRows();
            panel.style.display = "block";
        } else {
            panel.style.display = "none";
        }
    }

    window.addEventListener("keydown", function(e) {
        if (e.ctrlKey && e.altKey && !e.shiftKey && (e.key === "l" || e.key === "L" || e.code === "KeyL")) {
            e.preventDefault();
            togglePanel();
        }
    });
})();</script>
